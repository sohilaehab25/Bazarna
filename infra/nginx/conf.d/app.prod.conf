################################################################################
# infra/nginx/conf.d/app.prod.conf  —  Production server blocks
################################################################################

# ─── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bazarna.com www.bazarna.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bazarna.com www.bazarna.com;

    ssl_certificate     /etc/letsencrypt/live/bazarna.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bazarna.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'nonce-${request_id}'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss:; frame-ancestors 'none';"
        always;

    # ─── Forward request-id ────────────────────────────────────────────────────
    proxy_set_header X-Request-ID $req_id;
    add_header       X-Request-ID $req_id always;

    # ─── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=30 nodelay;

        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Cache safe GET responses
        proxy_cache            api_cache;
        proxy_cache_valid      200 1m;
        proxy_cache_methods    GET HEAD;
        proxy_cache_bypass     $http_authorization $http_pragma $http_cache_control;
        proxy_no_cache         $http_authorization;
        add_header             X-Cache-Status $upstream_cache_status always;
    }

    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;

        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # No caching on auth endpoints
        proxy_cache off;
    }

    # ─── WebSocket (Socket.IO) ────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;   # long-lived WebSocket connection
    }

    # ─── Health probes (bypass rate-limiting) ─────────────────────────────────
    location /health {
        proxy_pass http://api:3001/health;
        access_log off;
    }

    location /health/ready {
        proxy_pass http://api:3001/health/ready;
        access_log off;
    }

    # ─── Static assets (long cache, immutable) ───────────────────────────────
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|webp|gif|avif)$ {
        proxy_pass         http://frontend:4000;
        proxy_cache        api_cache;
        proxy_cache_valid  200 7d;
        expires            1y;
        add_header         Cache-Control "public, immutable" always;
        access_log         off;
    }

    # ─── Angular SSR ──────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
