<section class="admin-order-items" aria-label="Order items">
  <div class="admin-order-items__header">
    <h3 class="admin-order-items__title">Items</h3>
  </div>

  <div class="admin-order-items__table-wrapper" role="region" aria-label="Order items table" tabindex="0">
    <table class="admin-order-items__table">
      <thead>
        <tr>
          <th scope="col">Product</th>
          <th scope="col" class="admin-order-items__th--center">Qty</th>
          <th scope="col" class="admin-order-items__th--right">Unit price</th>
          <th scope="col" class="admin-order-items__th--right">Subtotal</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track $index) {
          <tr>
            <td class="admin-order-items__product-name">{{ getProductName(item) }}</td>
            <td class="admin-order-items__td--center">{{ item.quantity }}</td>
            <td class="admin-order-items__td--right">{{ getUnitPrice(item) }}</td>
            <td class="admin-order-items__td--right">{{ getSubtotal(item) }}</td>
          </tr>
        }
      </tbody>
      <tfoot>
        <tr class="admin-order-items__total-row">
          <td colspan="3" class="admin-order-items__total-label">Total</td>
          <td class="admin-order-items__total-value admin-order-items__td--right">{{ formatTotal() }}</td>
        </tr>
      </tfoot>
    </table>
  </div>
</section>
